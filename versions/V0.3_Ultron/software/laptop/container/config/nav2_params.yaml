# Nav2 parameters for Ultron_V0.3 (Bible §6.2 / B6 / §7.4).
# Key overrides vs stock:
#   - max_vel_x: 0.35  (autonomous cap — B6; stop margin ~23 mm)
#   - inflation_radius: 0.35
#   - amcl sensor_data_qos: 2 (best_effort) — REQUIRED for /scan QoS match
#   - obstacle_layer qos_policy_reliability: best_effort
nav2:
  ros__parameters:
    use_sim_time: false
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_bt_navigator::NavigateToPoseNavigator
      - nav2_bt_navigator::NavigateThroughPosesNavigator
      - nav2_bt_navigator::FollowWaypointsNavigator
      - nav2_bt_navigator::FollowPathNavigator
      - nav2_bt_navigator::BackUpNavigator
      - nav2_bt_navigator::WaitNavigator
      - nav2_bt_navigator::SpinNavigator

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      xy_goal_tolerance_from_cmd: False
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35          # B6: autonomous cap
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle:
        plugin: "dwb_critics::BaseObstacle"
        debug_visualization: True
        use_scale: False
      Oscillation:
        plugin: "dwb_critics::Oscillation"
        oscillation_reset_dist: 0.05
        forward_position_reset_dist: 0.3
        forward_heading_reset_dist: 0.9
      RotateToGoal:
        plugin: "dwb_critics::RotateToGoal"
      PathAlign:
        plugin: "dwb_critics::PathAlign"
        forward_point_distance: 0.3
      GoalAlign:
        plugin: "dwb_critics::GoalAlign"
        forward_point_distance: 0.3
      PathDist:
        plugin: "dwb_critics::PathDist"
        scale: 32.0
      GoalDist:
        plugin: "dwb_critics::GoalDist"
        scale: 24.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    use_smoother: true
    smoother_plugins: ["simple_smoother"]
    planner_plugins: ["GridBased"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      smoothing_duration: 0.2
      do_refinement: True
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: true

recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_recoveries::Spin"
    back_up:
      plugin: "nav2_recoveries::BackUp"
    wait:
      plugin: "nav2_recoveries::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.5]
    min_velocity: [-0.35, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    deadband_accel: [0.0, 0.0, 0.0]

# Local costmap: EKF provides odom->base_link, sensors in base_link frame.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      robot_base_frame: base_link
      global_frame: odom
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35        # > robot radius so the map pads walls
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # QoS MUST match the BEST_EFFORT rplidar publisher (§7.4).
          qos_policy_reliability: "best_effort"
          qos_history_policy: "keep_last"
          qos_depth: 10
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_base_frame: base_link
      global_frame: map
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.05
      robot_radius: 0.20
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          qos_policy_reliability: "best_effort"
          qos_history_policy: "keep_last"
          qos_depth: 10
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      track_unknown_space: true

# AMCL: sensor_data_qos: 2 is REQUIRED — Humble defaults to RELIABLE for
# /scan and silently fails localization on a QoS mismatch (§7.4).
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    sensor_data_qos: 2        # 2 = BEST_EFFORT (required for /scan)

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/ultron_laptop/maps/map.yaml"
    topic_name: "map"
    frame_id: "map"
