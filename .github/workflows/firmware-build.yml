name: firmware-build
on:
  push:
    paths:
      - 'versions/V0.3_Ultron/firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'versions/V0.3_Ultron/firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz \
            -o /tmp/arduino-cli.tar.gz
          tar -xzf /tmp/arduino-cli.tar.gz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile firmware (Mega 2560)
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:mega:cpu=atmega2560 \
            versions/V0.3_Ultron/firmware/ultron_firmware
        env:
          MAKEFLAGS: -j2
